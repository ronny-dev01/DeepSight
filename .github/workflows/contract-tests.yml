name: Backend Contract Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: sonar_mvp
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonar
        options: >-
          --health-cmd "pg_isready -U sonar -d sonar_mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+psycopg://sonar:sonar@127.0.0.1:5432/sonar_mvp
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-backend.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-backend.txt

      - name: Enable PostGIS
        run: >-
          python -c "from sqlalchemy import create_engine, text; import os; engine=create_engine(os.environ['DATABASE_URL']); conn=engine.connect(); conn.execute(text('CREATE EXTENSION IF NOT EXISTS postgis')); conn.commit(); conn.close()"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run worker contract test
        run: python -m tests.worker_contract_test

      - name: Run SSS ingestion contract test
        run: python -m tests.sss_ingestion_contract_test

      - name: Run SSS manifest validation test
        run: python -m tests.sss_manifest_validation_test

  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
